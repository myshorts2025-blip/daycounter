          mkdir -p app/src/main/java/com/example/daycounter
          cat > app/src/main/java/com/example/daycounter/DayCounterService.kt <<'EOF_2'
          package com.example.daycounter

          import android.content.SharedPreferences
          import android.graphics.Bitmap
          import android.graphics.BlurMaskFilter
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Rect
          import android.graphics.Typeface
          import android.os.Handler
          import android.os.Looper
          import android.os.PowerManager
          import android.os.SystemClock
          import android.service.wallpaper.WallpaperService
          import android.view.SurfaceHolder
          import java.time.Duration
          import java.time.LocalDateTime
          import kotlin.math.PI
          import kotlin.math.sin

          class DayCounterService : WallpaperService() {

              override fun onCreateEngine(): Engine = CounterEngine()

              inner class CounterEngine : Engine() {
                  // ---- Customize here ----
                  private val bgColor = Color.BLACK
                  private val numberColor = Color.WHITE
                  private val labelColor = Color.parseColor("#88FFFFFF")
                  private val effectsMs = 10_000L    // effects last 10 seconds after the screen turns on
                  private val tiltDegrees = 12f      // how far it tilts left/right
                  private val wiggleMs = 1500L       // how long each wiggle lasts
                  private val swingMs = 750.0        // time of one left-right swing inside a wiggle
                  private val cycleMs = 8000L        // a wiggle starts every 8 seconds (inside the 10 s)
                  private val frameDelayMs = 33L     // ~30 frames per second, only during the effects
                  // ------------------------

                  private val handler = Handler(Looper.getMainLooper())
                  private val redraw = Runnable { draw() }
                  private var visible = false
                  private var showStart = 0L

                  // cached glow picture (built once per number / screen size, then reused every frame)
                  private var glowBmp: Bitmap? = null
                  private var glowKey = ""
                  private var glowOffX = 0f
                  private var glowOffY = 0f
                  private var glowTextW = 0f

                  private val prefListener = SharedPreferences.OnSharedPreferenceChangeListener { _, _ ->
                      handler.post { if (visible) draw() }
                  }

                  private val numberPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = numberColor
                      textAlign = Paint.Align.CENTER
                      typeface = Typeface.create("sans-serif-light", Typeface.NORMAL)
                  }
                  private val labelPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = labelColor
                      textAlign = Paint.Align.CENTER
                      typeface = Typeface.create("sans-serif-medium", Typeface.NORMAL)
                      letterSpacing = 0.3f
                  }
                  private val edgePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      style = Paint.Style.STROKE
                      textAlign = Paint.Align.CENTER
                      typeface = numberPaint.typeface
                  }
                  private val bitmapPaint = Paint(Paint.FILTER_BITMAP_FLAG)

                  override fun onCreate(surfaceHolder: SurfaceHolder) {
                      super.onCreate(surfaceHolder)
                      DayStore.prefs(applicationContext).registerOnSharedPreferenceChangeListener(prefListener)
                  }

                  override fun onDestroy() {
                      DayStore.prefs(applicationContext).unregisterOnSharedPreferenceChangeListener(prefListener)
                      handler.removeCallbacks(redraw)
                      glowBmp?.recycle()
                      glowBmp = null
                      super.onDestroy()
                  }

                  override fun onVisibilityChanged(visible: Boolean) {
                      this.visible = visible
                      if (visible) {
                          showStart = SystemClock.uptimeMillis() // 10-second show starts when the screen is on
                          draw()
                      } else {
                          handler.removeCallbacks(redraw)
                      }
                  }

                  override fun onSurfaceChanged(holder: SurfaceHolder, format: Int, width: Int, height: Int) {
                      super.onSurfaceChanged(holder, format, width, height)
                      draw()
                  }

                  override fun onSurfaceDestroyed(holder: SurfaceHolder) {
                      visible = false
                      handler.removeCallbacks(redraw)
                      super.onSurfaceDestroyed(holder)
                  }

                  private fun batterySaverOn(): Boolean {
                      val pm = applicationContext.getSystemService(POWER_SERVICE) as PowerManager
                      return pm.isPowerSaveMode
                  }

                  /** 0..1 glow strength: fades in, gently pulses, fades out before the 10 seconds end. */
                  private fun glowIntensity(elapsed: Long): Float {
                      val t = elapsed.toFloat()
                      val fadeIn = 600f
                      val fadeOut = 1500f
                      val envelope = when {
                          t < fadeIn -> t / fadeIn
                          t > effectsMs - fadeOut -> ((effectsMs - t) / fadeOut).coerceIn(0f, 1f)
                          else -> 1f
                      }
                      val pulse = 0.8f + 0.2f * sin(2 * PI * t / 1400.0).toFloat()
                      return envelope * pulse
                  }

                  /** Builds the blurred glow picture once, so each animation frame only has to draw it. */
                  private fun ensureGlow(day: String, w: Float, textSize: Float, glowArgb: Int) {
                      val key = "$day@${w.toInt()}#$glowArgb"
                      if (key == glowKey && glowBmp != null) return

                      val p = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                          this.textSize = textSize
                          typeface = numberPaint.typeface
                          textAlign = Paint.Align.LEFT
                          color = glowArgb
                      }
                      val b = Rect()
                      p.getTextBounds(day, 0, day.length, b)
                      val pad = (w * 0.15f).toInt()
                      val bmp = Bitmap.createBitmap(b.width() + pad * 2, b.height() + pad * 2, Bitmap.Config.ARGB_8888)
                      val c = Canvas(bmp)
                      val ox = (pad - b.left).toFloat()
                      val oy = (pad - b.top).toFloat()

                      p.maskFilter = BlurMaskFilter(w * 0.07f, BlurMaskFilter.Blur.NORMAL)  // wide soft halo
                      c.drawText(day, ox, oy, p)
                      p.maskFilter = BlurMaskFilter(w * 0.02f, BlurMaskFilter.Blur.NORMAL)  // tight bright halo
                      c.drawText(day, ox, oy, p)

                      glowBmp?.recycle()
                      glowBmp = bmp
                      glowKey = key
                      glowOffX = (b.left - pad).toFloat()
                      glowOffY = (b.top - pad).toFloat()
                      glowTextW = p.measureText(day)
                  }

                  private fun draw() {
                      handler.removeCallbacks(redraw)
                      val holder = surfaceHolder
                      val canvas: Canvas = try { holder.lockCanvas() } catch (e: Exception) { null } ?: return

                      val ctx = applicationContext
                      val saver = batterySaverOn()
                      val wiggleOn = DayStore.isAnimated(ctx) && !saver
                      val glowOn = DayStore.isGlow(ctx) && !saver
                      val elapsed = SystemClock.uptimeMillis() - showStart
                      val active = elapsed < effectsMs
                      val phase = elapsed % cycleMs
                      val wiggling = wiggleOn && active && phase < wiggleMs
                      val glow = if (glowOn && active) glowIntensity(elapsed) else 0f

                      try {
                          val w = canvas.width.toFloat()
                          val h = canvas.height.toFloat()
                          canvas.drawColor(bgColor)

                          numberPaint.textSize = w * 0.6f
                          labelPaint.textSize = w * 0.05f

                          val day = DayStore.currentDay(ctx).toString()
                          val metrics = numberPaint.fontMetrics
                          val y = h / 2f - (metrics.ascent + metrics.descent) / 2f

                          val glowArgb = DayStore.glowColor(ctx)   // color picked in the app
                          if (glowOn) ensureGlow(day, w, numberPaint.textSize, glowArgb)

                          val angle = if (wiggling) {
                              val t = phase.toDouble()
                              val fade = 1.0 - t / wiggleMs
                              (tiltDegrees * sin(2 * PI * t / swingMs) * fade).toFloat()
                          } else 0f

                          canvas.save()
                          canvas.rotate(angle, w / 2f, h / 2f)

                          val bmp = glowBmp
                          if (glow > 0f && bmp != null) {
                              val a = (255 * glow).toInt().coerceIn(0, 255)
                              bitmapPaint.alpha = a
                              canvas.drawBitmap(bmp, w / 2f - glowTextW / 2f + glowOffX, y + glowOffY, bitmapPaint)

                              edgePaint.textSize = numberPaint.textSize
                              edgePaint.strokeWidth = w * 0.008f
                              edgePaint.color = glowArgb
                              edgePaint.alpha = a
                              canvas.drawText(day, w / 2f, y, edgePaint)   // thin bright edge line
                          }

                          canvas.drawText(day, w / 2f, y, numberPaint)
                          canvas.drawText("DAY", w / 2f, y + metrics.ascent - w * 0.03f, labelPaint)
                          canvas.restore()
                      } finally {
                          holder.unlockCanvasAndPost(canvas)
                      }

                      if (visible) {
                          val animating = active && (wiggleOn || glowOn)
                          val delay = if (animating) frameDelayMs else millisUntilMidnight() + 1000
                          handler.postDelayed(redraw, delay)
                      }
                  }

                  private fun millisUntilMidnight(): Long {
                      val now = LocalDateTime.now()
                      val next = now.toLocalDate().plusDays(1).atStartOfDay()
                      return Duration.between(now, next).toMillis()
                  }
              }
          }
          EOF_2
          mkdir -p app/src/main/java/com/example/daycounter
          cat > app/src/main/java/com/example/daycounter/DayStore.kt <<'EOF_3'
          package com.example.daycounter

          import android.content.Context
          import android.content.SharedPreferences
          import android.graphics.Color
          import java.time.LocalDate

          object DayStore {
              private const val PREFS = "daycounter"
              private const val KEY_START = "startEpochDay"
              private const val KEY_ANIM = "tiltAnimation"
              private const val KEY_GLOW = "glowEffect"
              private const val KEY_GLOW_COLOR = "glowColor"
              val DEFAULT_GLOW: Int = Color.parseColor("#00E5FF")
              const val CYCLE = 10

              fun prefs(ctx: Context): SharedPreferences =
                  ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE)

              /** Returns today's number, 1..10 (11th day wraps back to 1). */
              fun currentDay(ctx: Context): Int {
                  val p = prefs(ctx)
                  val today = LocalDate.now().toEpochDay()
                  if (!p.contains(KEY_START)) p.edit().putLong(KEY_START, today).apply()
                  val start = p.getLong(KEY_START, today)
                  return Math.floorMod(today - start, CYCLE.toLong()).toInt() + 1
              }

              /** Make today equal to [day] (1..10); counting continues from there. */
              fun setToday(ctx: Context, day: Int) {
                  val start = LocalDate.now().toEpochDay() - (day - 1)
                  prefs(ctx).edit().putLong(KEY_START, start).apply()
              }

              fun isAnimated(ctx: Context): Boolean = prefs(ctx).getBoolean(KEY_ANIM, true)

              fun setAnimated(ctx: Context, on: Boolean) {
                  prefs(ctx).edit().putBoolean(KEY_ANIM, on).apply()
              }

              fun isGlow(ctx: Context): Boolean = prefs(ctx).getBoolean(KEY_GLOW, true)

              fun setGlow(ctx: Context, on: Boolean) {
                  prefs(ctx).edit().putBoolean(KEY_GLOW, on).apply()
              }

              fun glowColor(ctx: Context): Int = prefs(ctx).getInt(KEY_GLOW_COLOR, DEFAULT_GLOW)

              fun setGlowColor(ctx: Context, color: Int) {
                  prefs(ctx).edit().putInt(KEY_GLOW_COLOR, color).apply()
              }
          }
          EOF_3
          mkdir -p app/src/main/java/com/example/daycounter
          cat > app/src/main/java/com/example/daycounter/HueBar.kt <<'EOF_4'
          package com.example.daycounter

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.LinearGradient
          import android.graphics.Paint
          import android.graphics.RectF
          import android.graphics.Shader
          import android.view.MotionEvent
          import android.view.View

          /** A rainbow slider: touch or drag to pick any color. */
          class HueBar(context: Context, private val onPick: (Int) -> Unit) : View(context) {

              private val density = resources.displayMetrics.density
              private val barPaint = Paint(Paint.ANTI_ALIAS_FLAG)
              private val thumbFill = Paint(Paint.ANTI_ALIAS_FLAG)
              private val thumbRing = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  color = Color.WHITE
                  strokeWidth = 3 * density
              }
              private val rect = RectF()
              private val pad = 20 * density
              private var hue = 180f
              private var current = Color.CYAN

              fun setColor(color: Int) {
                  val hsv = FloatArray(3)
                  Color.colorToHSV(color, hsv)
                  hue = hsv[0]
                  current = color
                  invalidate()
              }

              override fun onSizeChanged(w: Int, h: Int, oldw: Int, oldh: Int) {
                  super.onSizeChanged(w, h, oldw, oldh)
                  val colors = IntArray(7) { Color.HSVToColor(floatArrayOf(it * 60f, 1f, 1f)) }
                  barPaint.shader = LinearGradient(pad, 0f, w - pad, 0f, colors, null, Shader.TileMode.CLAMP)
              }

              override fun onDraw(canvas: Canvas) {
                  val w = width.toFloat()
                  val h = height.toFloat()
                  rect.set(pad, h * 0.35f, w - pad, h * 0.65f)
                  canvas.drawRoundRect(rect, h * 0.15f, h * 0.15f, barPaint)

                  val x = pad + (hue / 360f) * (w - 2 * pad)
                  thumbFill.color = current
                  canvas.drawCircle(x, h / 2f, h * 0.36f, thumbFill)
                  canvas.drawCircle(x, h / 2f, h * 0.36f, thumbRing)
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN, MotionEvent.ACTION_MOVE -> {
                          parent?.requestDisallowInterceptTouchEvent(true)
                          val f = ((e.x - pad) / (width - 2 * pad)).coerceIn(0f, 1f)
                          hue = f * 360f
                          current = Color.HSVToColor(floatArrayOf(hue, 1f, 1f))
                          invalidate()
                          onPick(current)
                          return true
                      }
                      MotionEvent.ACTION_UP -> {
                          performClick()
                          return true
                      }
                  }
                  return super.onTouchEvent(e)
              }

              override fun performClick(): Boolean {
                  super.performClick()
                  return true
              }
          }
