          cat > app/src/main/java/com/example/daycounter/MainActivity.kt <<'EOF_5'
          package com.example.daycounter

          import android.app.Activity
          import android.app.WallpaperManager
          import android.content.ComponentName
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.NumberPicker
          import android.widget.ScrollView
          import android.widget.Switch
          import android.widget.TextView

          class MainActivity : Activity() {

              private val presets = listOf(
                  "#00E5FF", "#2979FF", "#B44CFF", "#FF4081", "#FF1744",
                  "#FF9100", "#FFD600", "#00E676", "#FFFFFF"
              )

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val dp = resources.displayMetrics.density
                  val pad = (24 * dp).toInt()
                  val gap = (12 * dp).toInt()

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_HORIZONTAL
                      setPadding(pad, pad, pad, pad)
                  }

                  val label = TextView(this).apply {
                      text = "Today is day:"
                      textSize = 20f
                      gravity = Gravity.CENTER
                  }

                  val picker = NumberPicker(this).apply {
                      minValue = 1
                      maxValue = DayStore.CYCLE
                      value = DayStore.currentDay(this@MainActivity)
                  }

                  val tiltSwitch = Switch(this).apply {
                      text = "Tilt animation  "
                      textSize = 18f
                      isChecked = DayStore.isAnimated(this@MainActivity)
                      setPadding(0, gap, 0, gap)
                      setOnCheckedChangeListener { _, on -> DayStore.setAnimated(this@MainActivity, on) }
                  }

                  val glowSwitch = Switch(this).apply {
                      text = "Glow effect  "
                      textSize = 18f
                      isChecked = DayStore.isGlow(this@MainActivity)
                      setPadding(0, gap, 0, gap)
                      setOnCheckedChangeListener { _, on -> DayStore.setGlow(this@MainActivity, on) }
                  }

                  // ---- Glow color picker ----
                  val colorLabel = TextView(this).apply {
                      text = "Glow color"
                      textSize = 18f
                      gravity = Gravity.CENTER
                      setPadding(0, gap, 0, gap)
                  }

                  val preview = TextView(this).apply {
                      text = "10"
                      textSize = 56f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      setBackgroundColor(Color.BLACK)
                      setPadding(0, gap * 2, 0, gap * 2)
                  }

                  fun showColor(color: Int) {
                      preview.setShadowLayer(40f, 0f, 0f, color)
                      preview.invalidate()
                  }

                  val hueBar = HueBar(this) { color ->
                      DayStore.setGlowColor(this, color)
                      showColor(color)
                  }

                  val swatches = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER
                      setPadding(0, gap, 0, gap)
                  }
                  val dot = (28 * dp).toInt()
                  val margin = (2 * dp).toInt()
                  for (hex in presets) {
                      val c = Color.parseColor(hex)
                      val swatch = View(this)
                      swatch.background = GradientDrawable().apply {
                          shape = GradientDrawable.OVAL
                          setColor(c)
                          setStroke((2 * dp).toInt(), Color.GRAY)
                      }
                      swatch.layoutParams = LinearLayout.LayoutParams(dot, dot).apply {
                          setMargins(margin, 0, margin, 0)
                      }
                      swatch.setOnClickListener {
                          DayStore.setGlowColor(this, c)
                          hueBar.setColor(c)
                          showColor(c)
                      }
                      swatches.addView(swatch)
                  }

                  val startColor = DayStore.glowColor(this)
                  hueBar.setColor(startColor)
                  showColor(startColor)

                  val hint = TextView(this).apply {
                      text = "Effects play for 10 seconds each time you turn on the screen, then stop to save battery."
                      textSize = 13f
                      gravity = Gravity.CENTER
                      setPadding(0, gap, 0, gap)
                  }

                  val button = Button(this).apply {
                      text = "Set as live wallpaper"
                      setOnClickListener {
                          DayStore.setToday(this@MainActivity, picker.value)
                          val intent = Intent(WallpaperManager.ACTION_CHANGE_LIVE_WALLPAPER).putExtra(
                              WallpaperManager.EXTRA_LIVE_WALLPAPER_COMPONENT,
                              ComponentName(this@MainActivity, DayCounterService::class.java)
                          )
                          startActivity(intent)
                      }
                  }

                  root.addView(label)
                  root.addView(picker)
                  root.addView(tiltSwitch)
                  root.addView(glowSwitch)
                  root.addView(colorLabel)
                  root.addView(preview, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT))
                  root.addView(hueBar, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, (56 * dp).toInt()))
                  root.addView(swatches)
                  root.addView(hint)
                  root.addView(button)

                  val scroll = ScrollView(this)
                  scroll.addView(root, ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT))
                  setContentView(scroll)
              }
          }
