      - name: Use fixed signing key
        run: |
          mkdir -p ~/.android
          echo "" | base64 -d > ~/.android/debug.keystore
      - name: Create project files
        run: |
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF_0'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.daycounter"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.daycounter"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF_0
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_1'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature android:name="android.software.live_wallpaper" android:required="true" />

              <application
                  android:label="@string/app_name"
                  android:allowBackup="true"
                  android:theme="@android:style/Theme.Material.Light.DarkActionBar">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".DayCounterService"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_WALLPAPER">
                      <intent-filter>
                          <action android:name="android.service.wallpaper.WallpaperService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.service.wallpaper"
                          android:resource="@xml/daycounter_wallpaper" />
                  </service>
              </application>
          </manifest>
          EOF_1
          mkdir -p app/src/main/java/com/example/daycounter
          cat > app/src/main/java/com/example/daycounter/DayCounterService.kt <<'EOF_2'
          package com.example.daycounter

          import android.content.SharedPreferences
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Typeface
          import android.os.Handler
          import android.os.Looper
          import android.os.SystemClock
          import android.service.wallpaper.WallpaperService
          import android.view.SurfaceHolder
          import java.time.Duration
          import java.time.LocalDateTime
          import kotlin.math.PI
          import kotlin.math.sin

          class DayCounterService : WallpaperService() {

              override fun onCreateEngine(): Engine = CounterEngine()

              inner class CounterEngine : Engine() {
                  // ---- Customize here ----
                  private val bgColor = Color.BLACK
                  private val numberColor = Color.WHITE
                  private val labelColor = Color.parseColor("#88FFFFFF")
                  private val tiltDegrees = 10f      // how far it tilts left/right
                  private val tiltPeriodMs = 3000L   // time for one full left-right-left swing
                  private val frameDelayMs = 33L     // ~30 frames per second while animating
                  // ------------------------

                  private val handler = Handler(Looper.getMainLooper())
                  private val redraw = Runnable { draw() }
                  private var visible = false

                  private val prefListener = SharedPreferences.OnSharedPreferenceChangeListener { _, _ ->
                      handler.post { if (visible) draw() }
                  }

                  private val numberPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = numberColor
                      textAlign = Paint.Align.CENTER
                      typeface = Typeface.create("sans-serif-light", Typeface.NORMAL)
                  }
                  private val labelPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = labelColor
                      textAlign = Paint.Align.CENTER
                      typeface = Typeface.create("sans-serif-medium", Typeface.NORMAL)
                      letterSpacing = 0.3f
                  }

                  override fun onCreate(surfaceHolder: SurfaceHolder) {
                      super.onCreate(surfaceHolder)
                      DayStore.prefs(applicationContext).registerOnSharedPreferenceChangeListener(prefListener)
                  }

                  override fun onDestroy() {
                      DayStore.prefs(applicationContext).unregisterOnSharedPreferenceChangeListener(prefListener)
                      handler.removeCallbacks(redraw)
                      super.onDestroy()
                  }

                  override fun onVisibilityChanged(visible: Boolean) {
                      this.visible = visible
                      if (visible) draw() else handler.removeCallbacks(redraw)
                  }

                  override fun onSurfaceChanged(holder: SurfaceHolder, format: Int, width: Int, height: Int) {
                      super.onSurfaceChanged(holder, format, width, height)
                      draw()
                  }

                  override fun onSurfaceDestroyed(holder: SurfaceHolder) {
                      visible = false
                      handler.removeCallbacks(redraw)
                      super.onSurfaceDestroyed(holder)
                  }

                  private fun draw() {
                      handler.removeCallbacks(redraw)
                      val holder = surfaceHolder
                      val canvas: Canvas = try { holder.lockCanvas() } catch (e: Exception) { null } ?: return
                      val animate = DayStore.isAnimated(applicationContext)
                      try {
                          val w = canvas.width.toFloat()
                          val h = canvas.height.toFloat()
                          canvas.drawColor(bgColor)

                          numberPaint.textSize = w * 0.6f
                          labelPaint.textSize = w * 0.05f

                          val angle = if (animate) {
                              val phase = (SystemClock.uptimeMillis() % tiltPeriodMs).toDouble() / tiltPeriodMs
                              (tiltDegrees * sin(2 * PI * phase)).toFloat()
                          } else 0f

                          val day = DayStore.currentDay(applicationContext).toString()
                          val metrics = numberPaint.fontMetrics
                          val y = h / 2f - (metrics.ascent + metrics.descent) / 2f

                          canvas.save()
                          canvas.rotate(angle, w / 2f, h / 2f)
                          canvas.drawText(day, w / 2f, y, numberPaint)
                          canvas.drawText("DAY", w / 2f, y + metrics.ascent - w * 0.03f, labelPaint)
                          canvas.restore()
                      } finally {
                          holder.unlockCanvasAndPost(canvas)
                      }
                      if (visible) {
                          val delay = if (animate) frameDelayMs else millisUntilMidnight() + 1000
                          handler.postDelayed(redraw, delay)
                      }
                  }

                  private fun millisUntilMidnight(): Long {
                      val now = LocalDateTime.now()
                      val next = now.toLocalDate().plusDays(1).atStartOfDay()
                      return Duration.between(now, next).toMillis()
                  }
              }
          }
          EOF_2
          mkdir -p app/src/main/java/com/example/daycounter
          cat > app/src/main/java/com/example/daycounter/DayStore.kt <<'EOF_3'
          package com.example.daycounter

          import android.content.Context
          import android.content.SharedPreferences
          import java.time.LocalDate

          object DayStore {
              private const val PREFS = "daycounter"
              private const val KEY_START = "startEpochDay"
              private const val KEY_ANIM = "tiltAnimation"
              const val CYCLE = 10

              fun prefs(ctx: Context): SharedPreferences =
                  ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE)

              /** Returns today's number, 1..10 (11th day wraps back to 1). */
              fun currentDay(ctx: Context): Int {
                  val p = prefs(ctx)
                  val today = LocalDate.now().toEpochDay()
                  if (!p.contains(KEY_START)) p.edit().putLong(KEY_START, today).apply()
                  val start = p.getLong(KEY_START, today)
                  return Math.floorMod(today - start, CYCLE.toLong()).toInt() + 1
              }

              /** Make today equal to [day] (1..10); counting continues from there. */
              fun setToday(ctx: Context, day: Int) {
                  val start = LocalDate.now().toEpochDay() - (day - 1)
                  prefs(ctx).edit().putLong(KEY_START, start).apply()
              }

              fun isAnimated(ctx: Context): Boolean = prefs(ctx).getBoolean(KEY_ANIM, true)

              fun setAnimated(ctx: Context, on: Boolean) {
                  prefs(ctx).edit().putBoolean(KEY_ANIM, on).apply()
              }
          }
          EOF_3
          mkdir -p app/src/main/java/com/example/daycounter
          cat > app/src/main/java/com/example/daycounter/MainActivity.kt <<'EOF_4'
          package com.example.daycounter

          import android.app.Activity
          import android.app.WallpaperManager
          import android.content.ComponentName
          import android.content.Intent
          import android.os.Bundle
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.NumberPicker
          import android.widget.Switch
          import android.widget.TextView

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val dp = resources.displayMetrics.density
                  val pad = (24 * dp).toInt()
                  val gap = (16 * dp).toInt()

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(pad, pad, pad, pad)
                  }

                  val label = TextView(this).apply {
                      text = "Today is day:"
                      textSize = 20f
                      gravity = Gravity.CENTER
                  }

                  val picker = NumberPicker(this).apply {
                      minValue = 1
                      maxValue = DayStore.CYCLE
                      value = DayStore.currentDay(this@MainActivity)
                  }

                  val tiltSwitch = Switch(this).apply {
                      text = "Tilt animation  "
                      textSize = 18f
                      isChecked = DayStore.isAnimated(this@MainActivity)
                      setPadding(0, gap, 0, gap)
                      setOnCheckedChangeListener { _, on -> DayStore.setAnimated(this@MainActivity, on) }
                  }

                  val button = Button(this).apply {
                      text = "Set as live wallpaper"
                      setOnClickListener {
                          DayStore.setToday(this@MainActivity, picker.value)
                          val intent = Intent(WallpaperManager.ACTION_CHANGE_LIVE_WALLPAPER).putExtra(
                              WallpaperManager.EXTRA_LIVE_WALLPAPER_COMPONENT,
                              ComponentName(this@MainActivity, DayCounterService::class.java)
                          )
                          startActivity(intent)
                      }
                  }

                  root.addView(label)
                  root.addView(picker)
                  root.addView(tiltSwitch)
                  root.addView(button)
                  setContentView(root)
              }
          }
          EOF_4
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'EOF_5'
